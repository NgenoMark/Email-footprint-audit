name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy alembic "psycopg[binary]" python-dotenv cryptography google-auth google-auth-oauthlib google-api-python-client rq redis pytest
      - name: Run tests
        env:
          PYTHONPATH: backend
        run: pytest ../tests/backend -q
